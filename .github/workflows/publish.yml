name: Publish

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Node 24 ships npm 11.x. Trusted publishing requires npm >= 11.5.1;
          # Node 22 still bundles npm 10 and cannot perform the OIDC exchange.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: npm ci

      - run: npm run verify

      # Provenance is generated automatically by OIDC trusted publishing.
      - run: npm publish